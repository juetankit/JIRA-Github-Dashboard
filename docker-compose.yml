services:
  postgres:
    image: postgres:17
    container_name: jira-github-dashboard-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard_dev_password
      POSTGRES_DB: jira_github_dashboard

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U dashboard -d jira_github_dashboard",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: